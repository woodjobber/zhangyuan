<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成都 · 初高中数理化英知识点考频地图（本地真题导向）</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2430; --sub:#5b6474; --line:#e6e9f0;
    --shadow:0 6px 22px rgba(30,40,80,.08);
    --math:#e0653b; --phys:#2f7ce0; --chem:#3aa76d; --eng:#d1497d;
    --cd:#c0392b; --cdbg:#fdecea;
    --f5:#e8453c; --f4:#ef8a2e; --f3:#e0b400; --f2:#8a94a8;
    --f5bg:#fdecea; --f4bg:#fdf1e5; --f3bg:#fbf7e0; --f2bg:#f1f3f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC","WenQuanYi Micro Hei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,#8f1d1d,#c0392b 60%,#e0653b);color:#fff;box-shadow:0 4px 20px rgba(120,20,20,.28)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  .htop{display:flex;align-items:center;gap:14px;padding:15px 0 8px;flex-wrap:wrap}
  .logo{font-size:21px;font-weight:800;letter-spacing:.5px}
  .logo .badge{display:inline-block;background:#ffd27a;color:#7a2a00;font-size:13px;padding:2px 10px;border-radius:999px;margin-right:8px;vertical-align:2px}
  .logo span{color:#ffe0b8;font-weight:700;font-size:15px}
  .htip{font-size:12.5px;color:#ffe0d8;margin-left:auto}
  .stages{display:flex;gap:10px;padding-bottom:12px;flex-wrap:wrap}
  .stage-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;padding:7px 20px;border-radius:999px;cursor:pointer;font-size:14.5px;font-weight:700;transition:.2s}
  .stage-btn.active{background:#ffd27a;color:#5a1e00;border-color:#ffd27a}
  .stage-btn:hover:not(.active){background:rgba(255,255,255,.2)}
  /* 本地考情横幅 */
  .cdbar{position:sticky;top:0;z-index:45;background:#fff7f5;border-bottom:1px solid #f3d6d0;box-shadow:0 2px 10px rgba(180,40,30,.06)}
  .cdbar-inner{max-width:1180px;margin:0 auto;padding:11px 22px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .cdbar .flag{flex:none;font-size:13px;font-weight:800;color:#fff;background:var(--cd);padding:3px 11px;border-radius:7px;margin-top:1px}
  .cdbar .txt{flex:1;min-width:280px;font-size:13.5px;color:#6b3a34}
  .cdbar .txt b{color:var(--cd)}
  .cdbar .score{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:#fff;border:1px solid #f0cfc9;color:#96312a;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  /* toolbar */
  .toolbar{position:sticky;top:70px;z-index:40;background:var(--bg);padding:15px 0 8px;border-bottom:1px solid var(--line)}
  .row1{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .subjects{display:flex;gap:8px;flex-wrap:wrap}
  .sub-btn{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;color:var(--sub);transition:.18s;display:flex;align-items:center;gap:6px}
  .sub-btn .dot{width:9px;height:9px;border-radius:50%}
  .sub-btn .ver{font-size:10.5px;font-weight:600;color:#a7aeba;background:#f2f4f9;padding:1px 6px;border-radius:5px}
  .sub-btn.active{color:#fff;border-color:transparent;box-shadow:var(--shadow)}
  .sub-btn.active .ver{background:rgba(255,255,255,.25);color:#fff}
  .sub-btn[data-s="math"].active{background:var(--math)}
  .sub-btn[data-s="phys"].active{background:var(--phys)}
  .sub-btn[data-s="chem"].active{background:var(--chem)}
  .sub-btn[data-s="eng"].active{background:var(--eng)}
  .search{margin-left:auto;position:relative}
  .search input{width:230px;max-width:55vw;padding:9px 14px 9px 36px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;outline:none}
  .search input:focus{border-color:#d98a80;box-shadow:0 0 0 3px rgba(192,57,43,.1)}
  .search::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
  .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .row2 .lbl{font-size:13px;color:var(--sub);font-weight:700}
  .fbtn{border:1px solid var(--line);background:#fff;padding:5px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--sub);transition:.15s;display:flex;align-items:center;gap:5px}
  .fbtn .stars{letter-spacing:-1px;font-size:11px}
  .fbtn.active{color:#fff;border-color:transparent}
  .fbtn[data-f="5"].active{background:var(--f5)} .fbtn[data-f="4"].active{background:var(--f4)}
  .fbtn[data-f="3"].active{background:var(--f3)} .fbtn[data-f="2"].active{background:var(--f2)}
  .fbtn.only{color:var(--cd);border-color:#f0cfc9;background:#fff7f5}
  .fbtn.only.active{background:var(--cd);color:#fff;border-color:var(--cd)}
  .fbtn.reset{margin-left:auto;color:#9aa3b5}
  /* stats */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
  .stat{flex:1;min-width:110px;background:#fff;border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);border-left:4px solid #ccc}
  .stat .n{font-size:24px;font-weight:800}
  .stat .k{font-size:12.5px;color:var(--sub)}
  .stat.s5{border-color:var(--f5)} .stat.s4{border-color:var(--f4)} .stat.s3{border-color:var(--f3)} .stat.s2{border-color:var(--f2)}
  .stat.cd{border-color:var(--cd)} .stat.cd .n{color:var(--cd)}
  .statbar{height:8px;border-radius:5px;background:#eef0f6;overflow:hidden;margin-top:8px;display:flex}
  .statbar span{height:100%}
  /* intro */
  .intro{background:#fff;border-radius:14px;padding:16px 20px;box-shadow:var(--shadow);margin:14px 0 14px;border-left:5px solid var(--cd)}
  .intro h2{font-size:17px;margin-bottom:5px}
  .intro h2 em{font-style:normal;color:var(--cd);font-size:13px;font-weight:700;background:var(--cdbg);padding:2px 9px;border-radius:6px;margin-left:6px;vertical-align:2px}
  .intro p{color:var(--sub);font-size:14px}
  .legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--sub)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  /* 命题洞察卡 */
  .insight{background:linear-gradient(100deg,#fff8f6,#fff);border:1px dashed #eec3bc;border-radius:14px;padding:14px 20px;margin-bottom:18px}
  .insight h3{font-size:14.5px;color:var(--cd);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .insight ul{margin:0;padding-left:20px}
  .insight li{font-size:13.5px;color:#5d4440;margin:4px 0}
  .insight li b{color:var(--cd)}
  /* module */
  .module{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;border:1px solid var(--line)}
  .m-head{display:flex;align-items:center;gap:12px;padding:15px 20px;cursor:pointer;user-select:none;transition:.15s}
  .m-head:hover{background:#fafbfe}
  .m-idx{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
  .m-title{font-size:16px;font-weight:800}
  .m-meta{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
  .m-avg{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
  .m-wt{font-size:11.5px;font-weight:700;color:var(--cd);background:var(--cdbg);padding:2px 9px;border-radius:999px}
  .m-count{font-size:12px;color:var(--sub);background:#f0f2f8;padding:3px 10px;border-radius:999px}
  .arrow{flex:none;transition:.25s;color:#9aa3b5;font-size:13px}
  .module.open .arrow{transform:rotate(90deg)}
  .m-body{display:none;padding:2px 20px 18px 62px;border-top:1px solid var(--line)}
  .module.open .m-body{display:block}
  .kp{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:10px;border-bottom:1px solid #f2f4f9;margin:4px 0}
  .kp:last-child{border-bottom:none}
  .kp.f5{background:var(--f5bg)} .kp.f4{background:var(--f4bg)} .kp.f3{background:var(--f3bg)} .kp.f2{background:var(--f2bg)}
  .kp-badge{flex:none;width:52px;text-align:center}
  .kp-stars{font-size:12px;letter-spacing:-1px;line-height:1}
  .kp-lv{font-size:10px;font-weight:700;margin-top:2px}
  .kp.f5 .kp-stars,.kp.f5 .kp-lv{color:var(--f5)} .kp.f4 .kp-stars,.kp.f4 .kp-lv{color:var(--f4)}
  .kp.f3 .kp-stars,.kp.f3 .kp-lv{color:#b8860b} .kp.f2 .kp-stars,.kp.f2 .kp-lv{color:var(--f2)}
  .kp-main{flex:1}
  .kp-t{font-weight:700;font-size:14.5px;color:#2a3040;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .kp-d{color:var(--sub);font-size:13.5px;margin-top:3px}
  .kp-cd{font-size:12.5px;color:#96312a;margin-top:4px;background:#fff7f5;border-left:2px solid var(--cd);padding:3px 9px;border-radius:0 6px 6px 0}
  .tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:6px;font-weight:600;vertical-align:middle}
  .tag.hard{background:#eef0fd;color:#5a63c9} .tag.exp{background:#eaf6ee;color:#2f8a5a}
  .tag.local{background:var(--cd);color:#fff}
  .no-result{text-align:center;padding:50px;color:var(--sub);display:none}
  mark{background:#fff3bf;padding:0 2px;border-radius:3px}
  footer{text-align:center;color:#9aa3b5;font-size:13px;padding:22px 0 40px;line-height:1.9}
  .tip{font-size:12px;color:#b0b7c4;margin-top:4px}
  /* ===== 视图切换 ===== */
  .row0{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .row0 .lbl{font-size:13px;color:var(--sub);font-weight:700}
  .viewtoggle{display:inline-flex;background:#eef0f5;border-radius:10px;padding:3px;gap:2px}
  .vt{border:none;background:transparent;padding:7px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;color:var(--sub);transition:.18s;display:flex;align-items:center;gap:6px}
  .vt.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .vt.active[data-v="exam"]{color:var(--cd)}
  .vthint{font-size:12.5px;color:var(--sub);opacity:.85}
  /* ===== 考点视图：题型战场 ===== */
  .battle{border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.04)}
  .b-head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;background:linear-gradient(90deg,#fbfcfe,#fff);border-left:5px solid var(--math)}
  .b-head .b-idx{width:30px;height:30px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
  .b-title{font-size:16px;font-weight:800;color:var(--ink)}
  .b-desc{font-size:12.5px;color:var(--sub);margin-top:2px}
  .b-meta{margin-left:auto;display:flex;align-items:center;gap:10px}
  .b-score{font-size:12px;font-weight:700;color:#fff;background:var(--cd);padding:3px 10px;border-radius:20px}
  .b-cnt{font-size:12px;color:var(--sub);font-weight:600}
  .b-arrow{color:var(--sub);transition:.2s;font-size:12px}
  .battle.open .b-arrow{transform:rotate(90deg)}
  .b-body{padding:6px 18px 16px;display:none}
  .battle.open .b-body{display:block}
  .ekp{display:flex;gap:12px;padding:12px 14px;border-radius:10px;margin:10px 0;border:1px solid var(--line)}
  .ekp.f5{background:var(--f5bg);border-color:#f6c9c4} .ekp.f4{background:var(--f4bg);border-color:#f5d9b8}
  .ekp.f3{background:var(--f3bg);border-color:#efe6ad} .ekp.f2{background:var(--f2bg);border-color:#dfe3ea}
  .ekp-badge{flex-shrink:0;width:56px;text-align:center}
  .ekp-badge .kp-stars{font-size:11px;letter-spacing:-1px;line-height:1}
  .ekp-badge .kp-lv{font-size:10px;color:var(--sub);margin-top:3px;font-weight:700}
  .ekp-main{flex:1;min-width:0}
  .ekp-t{font-size:14.5px;font-weight:800;color:var(--ink);margin-bottom:5px}
  .ekp-row{font-size:13px;color:#3d4351;line-height:1.55;margin-top:3px}
  .ekp-row b{color:var(--cd)}
  .ekp-row .ico{font-weight:800;margin-right:4px}
  .ekp-row.q .ico{color:var(--phys)}
  .exam-banner{background:#fff6f4;border:1px dashed #e8b4ab;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:13.5px;color:#7a3b32;line-height:1.6}
  .exam-banner b{color:var(--cd)}
  @media(max-width:640px){.m-body{padding-left:20px}.search input{width:160px}.htip{display:none}.kp-badge{width:44px}.cdbar{position:static}.toolbar{top:0}.vt{padding:6px 12px;font-size:13px}.ekp-badge{width:46px}.b-meta .b-score{display:none}}

/* ===== 实战卡 ===== */
.dr-card{margin:8px 0 2px;border:1px dashed var(--phys);border-radius:8px;background:#f8fbff;overflow:hidden}
.dr-tab{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:700;color:var(--phys);background:#eef4ff}
.dr-tab .dr-n{font-weight:400;font-size:12px;color:#5b6b85}
.dr-tab .b-arrow{transition:transform .2s;font-size:11px}
.dr-card.open .dr-tab .b-arrow{transform:rotate(90deg)}
.dr-body{display:none;padding:10px 12px 12px}
.dr-card.open .dr-body{display:block}
.dr-sec-t{font-size:12px;font-weight:700;color:var(--cd);margin:8px 0 5px}
.dr-sec-t:first-child{margin-top:2px}
.dr-real,.dr-item{background:#fff;border:1px solid #e3eaf5;border-radius:7px;padding:8px 10px;margin-bottom:6px;font-size:13px;line-height:1.65}
.dr-y{display:inline-block;background:var(--cd);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;margin-bottom:4px}
.dr-q{color:#25303f}
.dr-a{margin-top:3px;color:#1c5a3a;background:#f0f8f3;border-left:3px solid var(--chem);padding:4px 8px;border-radius:0 5px 5px 0;font-size:12.5px}
.dr-trap{margin-top:4px;color:#8a3a2e;font-size:12.5px}
.dr-tpl{background:#fff7ee;border:1px solid #f5dcb8;border-radius:7px;padding:8px 10px;font-size:13px;line-height:1.7;color:#5b3f16}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="htop">
      <div class="logo"><span class="badge">成都专版</span>知识点考频地图 <span>· 数理化英 / 中考·高考真题导向</span></div>
      <div class="htip">教材版本·分值构成·命题风格 全部对齐成都本地</div>
    </div>
    <div class="stages" id="stages">
      <button class="stage-btn active" data-stage="cz">初中 · 成都中考</button>
      <button class="stage-btn" data-stage="gz">高中 · 四川新高考</button>
    </div>
  </div>
</header>

<div class="cdbar">
  <div class="cdbar-inner">
    <span class="flag" id="cdFlag">成都中考</span>
    <div class="txt" id="cdTxt"></div>
    <div class="score" id="cdScore"></div>
  </div>
</div>

<div class="wrap">
  <div class="toolbar">
    <div class="row0">
      <span class="lbl">视图：</span>
      <div class="viewtoggle" id="viewToggle">
        <button class="vt active" data-v="textbook">📚 教材视图</button>
        <button class="vt" data-v="exam">🎯 考点视图</button>
      </div>
      <span class="vthint" id="vthint">按课本章节铺开，系统学习、查漏补缺</span>
    </div>
    <div class="row1">
      <div class="subjects" id="subjects"></div>
      <div class="search"><input id="q" type="text" placeholder="搜知识点，如 浮力 / 侯氏制碱 / 定语从句…"></div>
    </div>
    <div class="row2" id="freqFilter">
      <span class="lbl">考频筛选：</span>
      <button class="fbtn active" data-f="all">全部</button>
      <button class="fbtn" data-f="5"><span class="stars" style="color:var(--f5)">★★★★★</span>必考</button>
      <button class="fbtn" data-f="4"><span class="stars" style="color:var(--f4)">★★★★</span>高频</button>
      <button class="fbtn" data-f="3"><span class="stars" style="color:var(--f3)">★★★</span>中频</button>
      <button class="fbtn" data-f="2"><span class="stars" style="color:var(--f2)">★★</span>低频</button>
      <button class="fbtn only" data-f="cd">🔴 只看成都特色考点</button>
      <button class="fbtn reset" id="expandAll">展开全部</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="intro" id="intro"></div>
  <div class="insight" id="insight"></div>
  <div id="content"></div>
  <div class="no-result" id="noResult">🔍 未找到匹配的知识点，换个关键词或调整考频筛选</div>
</main>

<footer>
  考频星级依据近年 <b>成都中考真题</b> 与 <b>四川新高考（全国二卷 + 四川卷）</b> 命题规律归纳，为本地复习优先级参考，非官方精确统计<br>
  <span class="tip">★5 必考（几乎年年必出）· ★4 高频 · ★3 中频 · ★2 低频/选学 ｜ 🔴成都特色 = 近三年本地卷反复出现或本土情境高频载体 ｜ 政策口径截至 2026-2027 学年，以当年成都市教育局公告为准</span>
</footer>

<script>
/* f:本地考频 5/4/3/2  tag:hard难点/exp拓展  cd:成都命题特色说明（有则打🔴标） wt:模块本地权重提示 */
const SUBJECTS={
  math:{name:"数学",color:"var(--math)",cz:"北师大版",gz:"人教A版"},
  phys:{name:"物理",color:"var(--phys)",cz:"教科版",gz:"教科版"},
  chem:{name:"化学",color:"var(--chem)",cz:"人教版",gz:"人教版"},
  eng:{name:"英语",color:"var(--eng)",cz:"人教版(Go for it!)",gz:"外研版"}
};

const CDBAR={
  cz:{flag:"成都中考",
      txt:"总分 <b>710 分</b>；语数英各 150（<b>A卷100+B卷50</b>）、物理 70（<b>A卷×50%+B卷20</b>）、化学 50（<b>只考A卷，×50%</b>）、体育 60；道法/历史/生物/地理各 20（等级折算）。物理化学含 <b>实验操作 15 分</b>。",
      score:["数学 A100+B50","物理 (A100×50%+B20)=70","化学 A100×50%=50","英语 A100(含听力30)+B50"]},
  gz:{flag:"四川新高考",
      txt:"成都采用 <b>“3+1+2”</b>：语数外各 150（<b>全国二卷</b>）；首选物理/历史 100（<b>原始分</b>，四川卷）；再选化学等 4 选 2，各 100（<b>等级赋分</b>，30 分起赋）。总分 750。",
      score:["数学/英语 全国Ⅱ卷 150","物理 四川卷 100(原始分)","化学 四川卷 100(等级赋分)","2025 首届新高考"]}
};

const DATA={
/* ============ 初中 · 成都中考 ============ */
cz:{
 math:{intro:"成都中考数学 150 分 = <b>A卷100（保基本盘）+ B卷50（拉区分度）</b>。A卷重通性通法，B卷 21-26 题定生死：几何填空压轴、新定义阅读、二次函数代几综合是三大关卡。",
  insight:[
    "<b>去套路化已成定局</b>：胡不归、阿氏圆、将军饮马等“网红模型”在近三年成都卷中<b>持续弱化甚至取消</b>，B25 回归课本基础定理的层层递进推理。",

 phys:{intro:"四川新高考<b>物理为首选科目，四川卷 100 分、原始分计入</b>（教科版教材）。四七九教研定调：<b>夯实力电基础</b>，单选压轴偏纯力学、多选压轴偏电磁、计算压轴“力电综合/电磁场粒子/电磁感应+力学”三足鼎立。2025 首届考生普遍反映<b>物理偏难</b>。",
  insight:[
    "<b>压轴三选一</b>：①力电综合 ②带电粒子在电磁场中运动 ③电磁感应+力学——<b>弹簧模型+电磁感应+电路功率</b>多模块整合是四川命题新方向。",
    "<b>高频选择题考点</b>：机械振动与波、交变电流（多以选择题）、热学集中在气体（选+算各半）、近代物理考波粒二象性。",
    "<b>直流电路在实验题考</b>：实验“一力一电”最普遍，教材改编/创新实验比例提高，开放题only三方向：<b>实验优化、原理分析、误差分析</b>。",
    "<b>情境化+跨模块整合</b>：不考公式记忆，考<b>深度情境下的分析、论证、推导</b>；图像分析、建模迁移、实验探究是四大能力。",
    "<b>大中衔接偶考</b>：配速法、涡旋电场、简谐近似、纯滚动、多物体关联——尖子生培优内容，不宜占用常规复习。"
  ],
  modules:[
   {t:"运动学",wt:"基础 · 约10分",kps:[

     {t:"运动学概念",d:"位移速度加速度、矢量性。",f:3}
   ]},
   {t:"相互作用与力",wt:"全卷前提",kps:[

     {t:"力的合成分解",d:"平行四边形、正交分解，必用工具。",f:5},

   {t:"牛顿运动定律",wt:"压轴候选 · 约15分",kps:[
     {t:"牛顿三定律",d:"F=ma、作用力反作用力、超重失重。",f:5},
     {t:"牛顿定律综合",d:"连接体、传送带、临界、多物体关联；<b>纯力学常为单选压轴焦点</b>。",f:5,tag:"hard",cd:"四七九教研：单选压轴以力电为主，纯力学是焦点"}

   {t:"曲线运动与万有引力",wt:"约15分",kps:[

     {t:"圆周运动",d:"向心力、临界、竖直平面圆周，高频。",f:5},
     {t:"万有引力与航天",d:"开普勒、天体质量、卫星变轨、宇宙速度，必考小题。",f:5},
     {t:"运动合成与分解",d:"小船过河、绳端速度，中档。",f:3}

   {t:"机械能·动量",wt:"压轴候选 · 约18分",kps:[

     {t:"动能定理",d:"多过程应用，必考工具。",f:5},
     {t:"机械能守恒",d:"条件判断、与圆周/弹簧综合。",f:5},
     {t:"动量定理与动量守恒",d:"守恒条件、碰撞反冲；<b>力电综合压轴常与动量/弹簧联用</b>。",f:5,tag:"hard",cd:"四川命题：弹簧模型+电磁感应+动量常在同一压轴综合"}

   {t:"静电场·恒定电流",wt:"约20分",kps:[
     {t:"电场力性质",d:"库仑、场强、电场线、叠加。",f:4},

     {t:"电容器与带电粒子",d:"平行板、粒子加速偏转，大题常客。",f:5,tag:"hard"},
     {t:"恒定电流与电路实验",d:"欧姆定律、电功率、电表改装；<b>直流电路通常在实验题考</b>。",f:5,cd:"四七九教研：直流电路通常在实验题中考察，实验一力一电"}

   {t:"磁场·电磁感应·交变电流",wt:"压轴核心 · 约25分",kps:[

     {t:"洛伦兹力与圆周",d:"半径周期、临界，必考；<b>带电粒子在电磁场中运动=计算压轴之一</b>。",f:5,cd:"计算压轴三足鼎立之一：电磁场中粒子运动"},
     {t:"复合场",d:"速度选择器、质谱仪、回旋加速器，压轴难点。",f:5,tag:"hard"},
     {t:"楞次定律与法拉第定律",d:"感应电流判断、E=nΔΦ/Δt，必考。",f:5},
     {t:"导体切割磁感线(压轴)",d:"E=BLv、杆导轨、<b>电磁感应+力学/电路功率综合</b>，四川压轴首选。",f:5,tag:"hard",cd:"四川命题：电磁感应+力学综合、弹簧模型+电路功率多模块整合，是压轴热门"},
     {t:"交变电流·变压器",d:"有效值、变压器、远距离输电，<b>高频选择题</b>。",f:5,cd:"四七九教研：交变电流考查概率高，多以选择题为主"},
     {t:"传感器实验",d:"利用传感器制作简单自动控制装置，创新实验开放题方向。",f:3,cd:"教研提示关注“传感器自动控制装置”实验与原理迁移"}
   ]},
   {t:"振动波·光·近代物理",wt:"选择题高频 · 约20分",kps:[
     {t:"机械振动与机械波",d:"简谐、单摆、波图象、干涉衍射多普勒，<b>选择题高频</b>。",f:5,cd:"四七九教研：机械振动与波考查概率高，多以选择题为主"},
     {t:"光学",d:"折射全反射、干涉衍射偏振，稳定考点。",f:5},
     {t:"光电效应与原子结构",d:"光子说、玻尔模型、能级跃迁，小题必考。",f:5},
     {t:"原子核与波粒二象性",d:"衰变、核反应方程、质能方程；<b>近代物理多考波粒二象性</b>。",f:4,cd:"四七九教研：近代物理多考察波粒二象性"},
     {t:"电磁波与相对论",d:"电磁波谱、相对论结论，轻考。",f:2}
   ]},
   {t:"热学(选考向)",wt:"约12分",kps:[

     {t:"热力学定律",d:"第一第二定律、能量耗散。",f:3}
   ]},
   {t:"实验(一力一电)",wt:"必考 · 约15分",kps:[
     {t:"力学实验(教材改编)",d:"测速度加速度、验证牛顿定律、机械能守恒等，教材改编+创新实验比例提高。",f:5,cd:"教研：实验一力一电最普遍，教材改编/创新实验比例提高"},
     {t:"电学实验(含伏安法)",d:"测电阻/测电源电动势内阻、电表改装；开放题三方向：优化/原理/误差。",f:5,cd:"实验开放问题仅三方向：实验优化、原理分析、误差分析"},
     {t:"图像分析与误差处理",d:"U-I、a-F 等图象处理、系统误差分析，实验得分关键。",f:5}

 chem:{intro:"四川新高考<b>化学为再选科目，四川卷 100 分、等级赋分</b>（A等前15%→100-86分，人教版）。<b>等级赋分意味着“排名比绝对分更重要”</b>：既要拿稳基础分，又要在氧化还原、平衡、电化学、有机推断上拉开位次。",
  insight:[
    "<b>赋分博弈</b>：化学选考人群强手多，A 等仅约 15%；<b>中档题零失误</b>比搏压轴更能保等级，压轴题决定能否冲 A。",
    "<b>四大主干</b>：氧化还原+离子反应（思维主线）、电化学、化学平衡/水溶液离子平衡、有机推断——构成四大题骨架。",
    "<b>流程题与实验探究是压轴常客</b>：工艺流程图、物质制备方案、误差分析、Ksp 沉淀转化。",
    "<b>NA 正误判断、离子共存、元素推断</b>是选择题固定送分/失分点，必须零失误。",
    "<b>STSE 情境延续成都风格</b>：航天燃料材料、双碳、新能源电池会继续以情境入题。"
  ],
  modules:[
   {t:"物质的量·化学计量",wt:"全卷底座 · 约12分",kps:[
     {t:"物质的量·气体摩尔体积",d:"n、NA、摩尔质量、阿伏加德罗定律，全卷计算基础。",f:5},
     {t:"NA正误判断",d:"阿伏加德罗常数类选择题，年年必考陷阱，须零失误。",f:5,tag:"hard"},
     {t:"物质的量浓度",d:"配制、稀释混合、相关计算，必考。",f:5}
   ]},
   {t:"离子反应·氧化还原",wt:"思维主线 · 约15分",kps:[
     {t:"物质分类与胶体",d:"分散系、胶体性质，小题常考。",f:3},
     {t:"离子反应",d:"离子方程式、离子共存、离子检验，选择题+大题必考。",f:5},
     {t:"氧化还原反应",d:"电子转移、配平、强弱规律、<b>陌生方程式书写</b>，全卷核心思维。",f:5,tag:"hard"}
   ]},
   {t:"元素化合物",wt:"约18分",kps:[
     {t:"钠·铝·铁及其化合物",d:"Na₂O₂、铝两性图像、Fe²⁺/Fe³⁺转化与检验，必考。",f:5,tag:"hard"},
     {t:"氯·硫·氮及其化合物",d:"氯气/次氯酸、SO₂与浓硫酸、<b>氨与硝酸工业流程</b>，大题高频。",f:5,tag:"hard"},
     {t:"碳硅与无机材料",d:"硅、二氧化硅、硅酸盐、新型无机材料。",f:3},
     {t:"元素推断(位构性)",d:"周期表+周期律+结构综合推断，选择题必考。",f:5}
   ]},
   {t:"物质结构与周期律",wt:"约15分",kps:[
     {t:"原子结构与电子排布",d:"核素、能层能级、基态排布、电离能电负性。",f:4},
     {t:"元素周期律",d:"半径/化合价/金属性递变、位构性推断，必考。",f:5},
     {t:"化学键与分子间作用力",d:"离子/共价键、氢键、<b>熔沸点比较</b>、晶体类型，高频。",f:5},
     {t:"分子空间结构与杂化",d:"VSEPR、杂化轨道、配合物，结构选考重点。",f:4,tag:"hard"},
     {t:"晶体结构与晶胞计算(曾漏)",d:"四类晶体、晶胞均摊法、密度/粒子数/配位数计算，选必2难点常考。",f:5,tag:"hard"}
   ]},
   {t:"反应与能量·电化学",wt:"大题必考 · 约16分",kps:[
     {t:"反应热与盖斯定律",d:"焓变、热化学方程式、盖斯定律计算，必考。",f:5,tag:"hard"},
     {t:"原电池与电解池",d:"原理、化学电源（<b>锂电/燃料电池等新能源</b>）、电解应用、金属腐蚀防护。",f:5,cd:"新能源电池（锂电/氢燃料）常作情境，延续成都STSE风格"},
     {t:"反应速率与化学平衡",d:"速率计算、平衡判断、勒夏特列、K 计算、三段式、等效平衡，必考大题。",f:5,tag:"hard"},
     {t:"平衡图像分析",d:"转化率、多曲线图像、条件改变的趋势推理，拉分题。",f:5,tag:"hard"}
   ]},
   {t:"水溶液离子平衡",wt:"难点 · 约14分",kps:[
     {t:"弱电解质与电离",d:"电离平衡、Kw、强弱电解质比较、稀释图像。",f:4},
     {t:"pH与中和滴定",d:"pH计算、滴定曲线、指示剂选择、误差分析，实验必考。",f:5},
     {t:"盐类水解",d:"水解规律、三大守恒、粒子浓度比较、双水解，高频难点。",f:5,tag:"hard"},
     {t:"沉淀溶解平衡",d:"Ksp、沉淀转化、分步沉淀、图像，压轴小题。",f:4,tag:"hard"}
   ]},
   {t:"有机化学",wt:"大题必考 · 约16分",kps:[
     {t:"有机基础与烃",d:"命名、同分异构体数目判断、烷烯炔苯、官能团性质，必考前提。",f:5},
     {t:"烃的衍生物与转化",d:"卤代烃/醇/酚/醛/羧酸/酯转化网络，<b>有机推断大题核心</b>。",f:5,tag:"hard"},
     {t:"有机合成路线设计",d:"官能团引入/保护、逆合成分析、条件书写，压轴难点。",f:5,tag:"hard"},
     {t:"营养物质与高分子",d:"糖油脂蛋白、加聚缩聚、合成材料，小题常考。",f:4}
   ]},
   {t:"化学实验",wt:"压轴大题 · 约14分",kps:[
     {t:"基本操作与分离提纯",d:"仪器、过滤蒸馏萃取、气密性检查，实验基础。",f:4},
     {t:"气体制备与检验除杂",d:"装置选择、离子/气体检验、除杂干燥。",f:4},
     {t:"实验方案设计与探究",d:"方案评价、控制系统变量、误差分析、<b>传感器/数字化实验</b>，压轴大题。",f:5,tag:"hard",cd:"数字化传感器实验延续成都中考跨学科风格，向上衔接"},
     {t:"工艺流程题",d:"原料预处理、条件控制、循环利用、产率计算，与中考侯氏制碱一脉相承。",f:5,tag:"hard",cd:"工艺流程题由成都中考压轴上延，高中成常规大题"}
   ]},
   {t:"STSE·化学与技术",wt:"选择题 · 约6分",kps:[
     {t:"资源环境与绿色化学",d:"海水综合利用、化工生产、大气/水污染治理、双碳。",f:3,tag:"exp"},
     {t:"化学与材料·生活·科技",d:"航天燃料与材料、新能源、药物与食品添加剂、传统文化中的化学。",f:3,tag:"exp",cd:"航天(神舟/嫦娥/天问)+双碳是成都卷长期情境IP"}
   ]}
  ]
 },
 eng:{intro:"四川新高考<b>英语用全国二卷（150分），外研版教材</b>（成都家长买教辅最易踩坑点）。全国二卷特点是<b>语篇长、词汇要求高、读后续写压轴</b>；语法填空+短文改错考点规律性强，是稳分区。",
  insight:[
    "<b>教材版本坑</b>：成都高中英语是<b>外研版</b>不是人教版，词汇书/同步练习须认准“外研版”。",
    "<b>读后续写/概要写作是新高考最大变量</b>：25 分档，考情节衔接+心理动作细节+语言风格一致性，决定英语能否上 130。",
    "<b>语法填空考点高度规律</b>：谓语（时态语态）、非谓语、词性转换、连词/从句引导词、冠词介词代词——按考点清单刷，性价比最高。",
    "<b>七选五与阅读重逻辑结构</b>：细节题减少，主旨/推断/观点/写作意图题增多；长难句（从句嵌套、非谓语）拆解是阅读关键。",
    "<b>词汇跨度大</b>：全国二卷阅读常出现课标外高频学术词，3500 词要熟到“熟词生义+同义替换”层面。"
  ],
  modules:[
   {t:"词汇与词法深化",wt:"全卷地基",kps:[
     {t:"高考核心词汇(3500)",d:"熟词生义、同义替换、词块搭配，阅读与写作的共同地基。",f:5},
     {t:"外研版教材词汇体系",d:"按外研版7册主题词汇推进，<b>勿买人教版词汇书</b>。",f:5,cd:"成都高中英语统一外研版，教辅/词汇书版本错配是常见坑"},
     {t:"构词法与词性转换",d:"前后缀、名动形副互转，语法填空“给词填空”核心考点。",f:5},
     {t:"名词·冠词·代词·介词",d:"抽象名词、it 用法、冠词特指泛指、介词固定搭配、with复合结构。",f:4},
     {t:"形容词副词与比较等级",d:"倍数表达、比较级特殊结构、排序。",f:3},
     {t:"情态动词",d:"对现在/过去推测、情态动词+have done。",f:4}
   ]},
   {t:"时态语态",wt:"语法填空必考",kps:[
     {t:"时态体系(16时态语境)",d:"各时态语境辨析、时态呼应、标志词；语法填空谓语考点年年必考。",f:5},
     {t:"被动语态深化",d:"各时态被动、主动表被动、get 被动。",f:4,tag:"hard"}
   ]},
   {t:"非谓语动词",wt:"语法填空难点",kps:[
     {t:"不定式",d:"各成分用法、省略、完成式、only to do 结果。",f:5},
     {t:"动名词",d:"作主宾、固定句型、与不定式意义区别。",f:4},
     {t:"分词(现在/过去)",d:"作状语/定语/补语、独立主格、悬垂分词判断，语法填空最难点。",f:5,tag:"hard"}
   ]},
   {t:"三大从句",wt:"语法+阅读双核心",kps:[
     {t:"名词性从句",d:"引导词选择、that/what 区别、语序、同位语从句。",f:5},
     {t:"定语从句",d:"关系词选择、介词+which、非限制性、as 引导，语法填空高频。",f:5,tag:"hard"},

0/1800=4cm，总水深13cm。"}],"tpl":"①受力：画浮体受力图，漂浮/悬浮写F浮=G总 → ②排液：V排=F浮/(ρ液g) → ③液面：Δh液面=V排/S容器 → ④分阶段：进水/加载/卸载类题按临界状态分段。"},"测量类实验":{"real":[{"y":"成都中考·实验操作（15分）","q":"测量小石块的密度（天平+量筒）、测量小灯泡电功率等，操作考试直计升学分","a":"天平调平→测质量→量筒测体积→ρ=m/V；电功率用伏安法","trap":"天平「左物右码」、量筒读数视线与凹液面相平、先测质量后测体积（防沾水误差），操作细节逐项给分"}],"drill":[{"q":"天平指针偏右，应如何调节？石块放右盘、砝码放左盘（20g+5g），游码2.4g，石块真实质量？","a":"测量前指针偏右→平衡螺母向左调；放反时：砝码质量=物体质量+游码，故m=25-2.4=22.6g。"},{"q":"量筒中水20mL，放入石块后液面升至28mL，石块质量22.6g，求密度。","a":"V=8cm³，ρ=22.6/8=2.825g/cm³=2.825×10³kg/m³。"}],"tpl":"①调平（游码归零→调螺母）→ ②测质量（左物右码，砝码从大到小）→ ③测体积（量筒/排水法/针压法）→ ④计算ρ=m/V → ⑤误差分析（先测体积会偏大/偏小）。"}},"chem":{"酸碱盐综合推断/除杂":{"real":[{"y":"成都中考A卷（常年）","q":"以「标签破损/废液成分/污水处理」为情境，推断溶液中溶质成分，设计除杂方案","a":"离子共存+反应顺序+过量判断，用「加试剂→现象→结论」三步写","trap":"推断题必须考虑「过量」：反应后溶液中一定含生成物，可能含某反应物剩余；除杂不能引入新杂质"}],"drill":[{"q":"某溶液含NaCl和Na₂CO₃，要除去Na₂CO₃得到纯净NaCl溶液，加什么试剂？如何判断已除尽？","a":"加适量稀盐酸（或滴加至不再产生气泡）；取少量加酸无气泡即除尽。过量盐酸可加热蒸发除去。"},{"q":"向含HCl和CaCl₂的混合溶液中逐滴加入Na₂CO₃溶液，写出反应先后顺序及现象。","a":"先与HCl反应：Na₂CO₃+2HCl=2NaCl+H₂O+CO₂↑（有气泡）；HCl耗尽后Na₂CO₃+CaCl₂=CaCO₃↓+2NaCl（有白色沉淀）。"}],"tpl":"①列离子（把溶质拆成离子）→ ②判共存（生成沉淀/气体/水的不能共存）→ ③定顺序（酸碱中和优先，再沉淀）→ ④写过量的影响（先/后反应）→ ⑤验证方案：取样+试剂+现象+结论。"},"复分解与离子共存":{"real":[{"y":"成都中考（高频）","q":"判断离子能否大量共存、溶液颜色、pH条件（酸性/碱性/无色）","a":"记牢「沉淀、气体、水」三类不共存；注意Cu²⁺蓝、Fe³⁺黄、Fe²⁺浅绿、MnO₄⁻紫红","trap":"「无色」排除有色离子；「酸性」隐含大量H⁺，「碱性」隐含大量OH⁻；HCO₃⁻与H⁺、OH⁻都不共存"}],"drill":[{"q":"无色溶液中能大量共存的一组：A. K⁺ Cu²⁺ NO₃⁻ SO₄²⁻  B. Na⁺ H⁺ CO₃²⁻ Cl⁻  C. K⁺ Na⁺ NO₃⁻ Cl⁻  D. Ba²⁺ Na⁺ SO₄²⁻ OH⁻","a":"选C。A中Cu²⁺有色；B中H⁺与CO₃²⁻生成气体；D中Ba²⁺与SO₄²⁻生成沉淀。"},{"q":"pH=1的溶液中，下列离子能共存的是：Na⁺、Fe²⁺、Cl⁻、NO₃⁻ ？","a":"不能。酸性条件下NO₃⁻具有强氧化性，会把Fe²⁺氧化为Fe³⁺。（若忽略此点则错）"}],"tpl":"①看限定词（无色/酸性/碱性/pH）→ ②排有色 → ③两两组合查沉淀表/气体/水 → ④注意隐藏氧化还原（H⁺+NO₃⁻）→ ⑤选完再逐项验证。"}},"eng":{"话题作文":{"real":[{"y":"2025成都中考B卷（15分）","q":"以「你最喜欢的科学探究场所」为题写发言稿，给出调查数据（本校62%、在家6%、大学18%、其他14%），约80词","a":"开头点题→数据引用（As the survey shows, 62% of students…）→个人选择+两点理由→结尾号召","trap":"发言稿格式：有称呼（Dear classmates）、有开头问候、有结尾致谢；数据不能直接照抄中文标点，要用英文表达百分比"}],"drill":[{"q":"用3种不同句式表达「62%的学生选择在学校实验室探究」。","a":"① 62% of the students     <div class="stat s2"><div class="n" style="color:var(--f2)">${c[2]}</div><div class="k">★★ 低频</div></div>
    <div class="stat cd"><div class="n">${cd}</div><div class="k">🔴 成都特色考点</div></div>
    <div class="stat" style="border-color:#5b6474"><div class="n">${total}</div><div class="k">知识点总数</div>
      <div class="statbar">${seg(c[5],"var(--f5)")}${seg(c[4],"var(--f4)")}${seg(c[3],"var(--f3)")}${seg(c[2],"var(--f2)")}</div></div>`;
}
function avgFreq(m){return (m.kps.reduce((a,k)=>a+k.f,0)/m.kps.length).toFixed(1);}
function render(){
  const data=DATA[curStage][curSub];
  const stageName=curStage==="cz"?"成都中考":"四川新高考";
  renderCDBar();
  introEl.innerHTML=`<h2>${stageName} · ${SUBJECTS[curSub].name}<em>${curView==="exam"?"应试作战地图 · "+stageName+"题型战役":"教材："+(curStage==="cz"?SUBJECTS[curSub].cz:SUBJECTS[curSub].gz)}</em></h2><p>${curView==="exam"?EXAM[curStage][curSub].banner:data.intro}</p>
    <div class="legend">
      <span><i style="background:var(--f5)"></i>★★★★★ 必考</span>
      <span><i style="background:var(--f4)"></i>★★★★ 高频</span>
      <span><i style="background:var(--f3)"></i>★★★ 中频</span>
      <span><i style="background:var(--f2)"></i>★★ 低频</span>
      <span><i style="background:var(--cd)"></i>🔴 成都特色考点</span>
      <span><i style="background:#eef0fd"></i>难点</span>
      <span><i style="background:#eaf6ee"></i>拓展</span>
    </div>`;
  introEl.style.borderLeftColor=SUBJECTS[curSub].color;
  insightEl.innerHTML=`<h3>🎯 ${stageName} ${SUBJECTS[curSub].name} · 本地命题洞察</h3><ul>${data.insight.map(i=>`<li>${i}</li>`).join("")}</ul>`;
  renderStats();
  if(curView==="exam") renderExam(); else renderTextbook(data);
  $("#noResult").style.display="none";$("#q").value="";
}
/* 教材视图：按课本章节铺开 */
function renderTextbook(data){
  contentEl.innerHTML="";
  data.modules.forEach((m,i)=>{
    const color=SUBJECTS[curSub].color,avg=+avgFreq(m),fi=FINFO[Math.round(avg)];
    const visible=m.kps.filter(k=>(curFilter==="all")||(curFilter==="cd"&&k.cd)||(k.f==curFilter));
    if(visible.length===0)return;
    const kpHTML=m.kps.map(k=>{
      const hide=(curFilter!=="all"&&!(curFilter==="cd"&&k.cd)&&k.f!=curFilter)?" style=\"display:none\"":"";
      const tags=(k.tag?`<span class="tag ${k.tag}">${k.tag==="hard"?"难点":"拓展"}</span>`:"")+(k.cd?`<span class="tag local">🔴 成都特色</span>`:"");
      const cdBox=k.cd?`<div class="kp-cd">📍 ${k.cd}</div>`:"";
      return `<div class="kp f${k.f}" data-f="${k.f}" data-cd="${k.cd?1:0}"${hide}>
        <div class="kp-badge"><div class="kp-stars">${stars(k.f)}</div><div class="kp-lv">${FINFO[k.f].n}</div></div>
        <div class="kp-main"><div class="kp-t">${k.t}${tags}</div><div class="kp-d">${k.d}</div>${cdBox}</div></div>`;
    }).join("");
    const mod=document.createElement("div");
    mod.className="module"+(expanded||curFilter!=="all"?" open":"");mod.dataset.mod=i;
    mod.innerHTML=`
      <div class="m-head">
        <div class="m-idx" style="background:${color}">${i+1}</div>
        <div class="m-title">${m.t}</div>
        <div class="m-meta">
          ${m.wt?`<span class="m-wt">${m.wt}</span>`:""}
          <span class="m-avg" style="background:${fi.bg};color:${fi.c}">均★${avg}</span>
          <span class="m-count">${m.kps.length} 点</span>
          <span class="arrow">▶</span>
        </div>
      </div>
      <div class="m-body">${kpHTML}</div>`;
    mod.querySelector(".m-head").onclick=()=>mod.classList.toggle("open");
    contentEl.appendChild(mod);
  });
}
/* 考点视图：按题型战役重组，应试作战地图 */
const isCD=(y)=>y&&/成都|20\d\d|九章|蓉|公园|特色|压轴|侯氏/.test(y);
/* 把考点视图的考点项 it 按标题关联到 DRILL 实战卡字典（支持 @@ 合并键、括号归一化） */
/* 考点标题 → 实战卡键 的显式别名（自动匹配覆盖不到的压轴/拆分栏） */
const DRILL_ALIAS={
  "gz>math>恒成立/零点/极值点偏移":"导数与单调性·极值"
};
function getDrill(stage,sub,title){
  const bag=(DRILL[stage]&&DRILL[stage][sub])||null; if(!bag) return null;
  const keys=[];
  const alias=DRILL_ALIAS[stage+">"+sub+">"+title];
  if(alias&&bag[alias]&&keys.indexOf(alias)<0) keys.push(alias);
  if(bag[title]) keys.push(title);
  /* 合并键形如 "A@@B"：若其中一段等于当前考点标题，则一并并入 */
  for(const k in bag){ if(k!==title&&k.indexOf("@@")>-1&&k.split("@@").indexOf(title)>-1) keys.push(k); }
  /* 括号/空格归一化兜底匹配 */
  if(!keys.length){
    const nt=String(title).replace(/[（）()\s·]/g,"");
    for(const k in bag){ if(String(k).replace(/[（）()\s·]/g,"")===nt){ keys.push(k); break; } }
  }
  if(!keys.length) return null;
  const real=[],drill=[]; let tpl="";
  keys.forEach(function(k){ const d=bag[k]||{};
    (d.real||[]).forEach(function(r){ real.push(r); });
    (d.drill||[]).forEach(function(x){ drill.push(x); });
    if(d.tpl&&!tpl) tpl=d.tpl;
  });
  return {real:real,drill:drill,tpl:tpl,label:title};
}
function drillHTML(it){
  const d=getDrill(curStage,curSub,it.t); if(!d) return "";
  const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const reals=d.real.map(r=>`<div class="dr-real"><span class="dr-y">${esc(r.y)}</span><div class="dr-q">${esc(r.q)}</div><div class="dr-a"><b>答案：</b>${esc(r.a)}</div><div class="dr-trap">⚠️ ${esc(r.trap)}</div></div>`).join("");
  const drills=d.drill.map((x,i)=>`<div class="dr-item"><b>变式${i+1}：</b>${esc(x.q)}<div class="dr-a"><b>解析：</b>${esc(x.a)}</div></div>`).join("");
  return `<div class="dr-card" data-hit="1" onclick="event.stopPropagation()">
    <div class="dr-tab" onclick="this.parentNode.classList.toggle('open')">🎯 实战卡 · ${esc(d.label||it.t)} <span class="dr-n">真题${d.real.length} · 变式${d.drill.length} · 答题模板</span><span class="b-arrow">▶</span></div>
    <div class="dr-body"><div class="dr-sec-t">📕 真题回放</div>${reals}<div class="dr-sec-t">✏️ 变式训练</div>${drills}<div class="dr-sec-t">🧩 答题模板</div><div class="dr-tpl">${esc(d.tpl)}</div></div></div>`;
}
function renderExam(){
  contentEl.innerHTML="";
  const ex=EXAM[curStage][curSub],color=SUBJECTS[curSub].color;
  if(ex.banner){const bd=document.createElement("div");bd.className="exam-banner";bd.innerHTML="🧭 "+ex.banner;contentEl.appendChild(bd);}
  ex.groups.forEach((g,gi)=>{
    const itemsHTML=g.items.map(it=>{
      const cdHit=(curFilter==="cd"&&isCD(it.y));
      const hide=(curFilter!=="all"&&!cdHit&&it.f!=curFilter)?" style=\"display:none\"":"";
      const tag=(it.tag?`<span class="tag ${it.tag}">${it.tag==="hard"?"难点":"拓展"}</span>`:"");
      const cdTag=isCD(it.y)?`<span class="tag local">🔴 成都高频</span>`:"";
      return `<div class="ekp f${it.f}" data-f="${it.f}" data-cd="${isCD(it.y)?1:0}"${hide}>
        <div class="ekp-badge"><div class="kp-stars">${stars(it.f)}</div><div class="kp-lv">${FINFO[it.f].n}</div></div>
        <div class="ekp-main"><div class="ekp-t">${it.t}${tag}${cdTag}</div>
          <div class="ekp-row q"><span class="ico">📝 怎么考：</span>${it.q}</div>
          <div class="ekp-row"><span class="ico" style="color:var(--cd)">📍 出处：</span><b>${it.y}</b></div>
        ${drillHTML(it)}</div></div>`;
    }).join("");
    const avg=(g.items.reduce((a,it)=>a+it.f,0)/g.items.length).toFixed(1);
    const b=document.createElement("div");
    b.className="battle"+(expanded||curFilter!=="all"?" open":"");
    b.dataset.tt=(g.t+" "+(g.d||"")+" "+g.items.map(it=>it.t+" "+it.y).join(" ")).toLowerCase();
    b.innerHTML=`<div class="b-head" style="border-left-color:${color}">
      <div class="b-idx" style="background:${color}">${gi+1}</div>
      <div style="min-width:0"><div class="b-title">${g.t}</div><div class="b-desc">${g.d||""}</div></div>
      <div class="b-meta"><span class="b-cnt">${g.items.length}个考点 · 均★${avg}</span><span class="b-arrow">▶</span></div>
    </div><div class="b-body">${itemsHTML}</div>`;
    b.querySelector(".b-head").onclick=()=>b.classList.toggle("open");
    contentEl.appendChild(b);
  });
  /* 渲染后按当前搜索词复原：命中考点若带实战卡则自动展开 */
  const _qe=$("#q"); const kw=(_qe&&_qe.value||"").trim().toLowerCase();
  if(curView==="exam"&&kw){
    contentEl.querySelectorAll(".ekp").forEach(k=>{
      const card=k.querySelector(".dr-card"); if(!card)return;
      const hit=k.textContent.toLowerCase().includes(kw);
      card.classList.toggle("open", hit && k.style.display!=="none");
    });
  }
}
document.querySelectorAll(".stage-btn").forEach(b=>{
  b.onclick=()=>{document.querySelectorAll(".stage-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");curStage=b.dataset.stage;expanded=false;$("#expandAll").textContent="展开全部";
    buildSubjectTabs();render();};
});
document.querySelectorAll("#freqFilter .fbtn").forEach(b=>{
  if(b.classList.contains("reset"))return;
  b.onclick=()=>{document.querySelectorAll("#freqFilter .fbtn:not(.reset)").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");curFilter=b.dataset.f;const _k=$("#q").value;render();if(_k)$("#q").value=_k;_applySearch();};
});
$("#expandAll").onclick=()=>{expanded=!expanded;
  document.querySelectorAll(".module,.battle").forEach(m=>m.classList.toggle("open",expanded));
  $("#expandAll").textContent=expanded?"收起全部":"展开全部";};
function _applySearch(){
  const kw=$("#q").value.trim().toLowerCase();let any=false;
  const cardSel=curView==="exam"?".ekp":".kp",grpSel=curView==="exam"?".battle":".module";
  contentEl.querySelectorAll(grpSel).forEach(m=>{
    let vis=0;
    const grpHit=kw&&(m.dataset.tt||"").toLowerCase().includes(kw);
    m.querySelectorAll(cardSel).forEach(k=>{
      const hit=!kw||grpHit||k.textContent.toLowerCase().includes(kw);
      const fok=curFilter==="all"||(curFilter==="cd"&&k.dataset.cd==="1")||k.dataset.f===curFilter;
      const show=hit&&fok;k.style.display=show?"":"none";if(show)vis++;
      if(curView==="exam"){const card=k.querySelector(".dr-card");if(card)card.classList.toggle("open",show&&!!kw);}
    });
    m.style.display=vis?"":"none";if(vis){m.classList.add("open");any=true;}
  });
  $("#noResult").style.display=(kw&&!any)?"block":"none";
}
$("#q").oninput=_applySearch;
/* 视图切换 */
document.querySelectorAll("#viewToggle .vt").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#viewToggle .vt").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");curView=b.dataset.v;
    $("#vthint").textContent=curView==="exam"?"按成都/四川题型战役重组：考点 → 怎么考 → 真题出处，应试作战":"按课本章节铺开，系统学习、查漏补缺";
    expanded=false;$("#expandAll").textContent="展开全部";
    $("#q").value="";render();
  };
});
buildSubjectTabs();render();
</script>
</body>
